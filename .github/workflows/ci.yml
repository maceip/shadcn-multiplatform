name: Verify library

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-inventory:
    name: Source inventory and xterm behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: uikit/src/jvmTest/terminal/package-lock.json
      - run: python3 scripts/verify_prompt_port.py
      - run: npm ci
        working-directory: uikit/src/jvmTest/terminal
      - run: npx playwright install --with-deps chromium
        working-directory: uikit/src/jvmTest/terminal
      - run: npm test
        working-directory: uikit/src/jvmTest/terminal

  jvm:
    name: JVM interactions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and desktop demo compilation (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bash ./gradlew :uikit:jvmTest :demoApp:desktopApp:assemble --max-workers=2 --no-daemon --console=plain '-Dorg.gradle.jvmargs=-Xmx3g' '-Pkotlin.daemon.jvmargs=-Xmx2g'
      - name: Tests and desktop demo compilation (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat :uikit:jvmTest :demoApp:desktopApp:assemble --max-workers=2 --no-daemon --console=plain '-Dorg.gradle.jvmargs=-Xmx3g' '-Pkotlin.daemon.jvmargs=-Xmx2g'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-tests-${{ matrix.os }}
          path: |
            uikit/build/reports/tests/jvmTest/
            uikit/build/test-results/jvmTest/

  android:
    name: Android demo build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew :uikit:compileAndroidMain :demoApp:androidApp:assembleDebug --max-workers=2 --no-daemon --console=plain '-Dorg.gradle.jvmargs=-Xmx3g' '-Pkotlin.daemon.jvmargs=-Xmx2g'

  wasm:
    name: Wasm demo executable
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The final Wasm IR link includes the full generated icon gallery. Give it
      # one heap instead of competing Gradle/Kotlin daemons and Android workers.
      - run: bash ./gradlew :demoApp:webApp:wasmJsBrowserDevelopmentExecutableDistribution --max-workers=1 --no-parallel --no-daemon --console=plain '-Dorg.gradle.jvmargs=-Xmx5g' '-Pkotlin.compiler.execution.strategy=in-process'
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-demo
          path: demoApp/webApp/build/dist/wasmJs/developmentExecutable/

  ios:
    name: iOS compilation
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew :uikit:compileKotlinIosArm64 :uikit:compileKotlinIosSimulatorArm64 :demoApp:commonApp:compileKotlinIosArm64 :demoApp:commonApp:compileKotlinIosSimulatorArm64 --max-workers=2 --no-daemon --console=plain '-Dorg.gradle.jvmargs=-Xmx3g' '-Pkotlin.daemon.jvmargs=-Xmx2g'
